name: proofline

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: proofline
      POSTGRES_PASSWORD: proofline
      POSTGRES_DB: proofline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofline -d proofline"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://proofline:proofline@db:5432/proofline"
      JWT_SECRET: "dev-secret-change-me"
      MOCK_AI: "true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:8000"
      NEXT_PUBLIC_USE_MOCK: "true"
    depends_on:
      - backend

volumes:
  pgdata:
